<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="landing-header" id="header">
        <nav>
            <a href="trabajos.html" class="nav-link" data-i18n="nav-trabajos">trabajos</a>
            <a href="sobre.html" class="nav-link" data-i18n="nav-sobre">sobre</a>
            <a href="contacto.html" class="nav-link" data-i18n="nav-contacto">contacto</a>
        </nav>
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <!-- NOSOTROS -->
    <section id="nosotros" class="fade-in">
        <div class="nosotros-container" style="max-width: 1200px; padding: 0 var(--space-4); margin: 0 auto;">
            <h2 class="reveal section-title" data-i18n="about-title">Sobre</h2>
            <div id="personCards" class="about-stack" style="width: 100%;">
                <!-- Se llena dinámicamente desde Dropbox -->
            </div>
        </div>
    </section>

    <!-- SELECTOR DE IDIOMA -->
    <div class="language-selector" style="position: fixed; bottom: 30px; right: 30px; z-index: 200;">
        <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
        <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
        <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>

        function renderAboutGrid(container, texts, images) {
            const labelText = localStorage.getItem('selectedLanguage') === 'en' ? '01 — Our vision' : 
                            localStorage.getItem('selectedLanguage') === 'de' ? '01 — Unsere Vision' : 
                            '01 — Nuestra visión';
                            
            const textLead = texts[0] || '';
            const textSecondary = texts.slice(1).join('<br><br>');
            
            let imagesHtml = '';
            if (images.length >= 2) {
                imagesHtml = `
                    <div class="about-image-wrapper offset-up reveal">
                        <img src="${images[0].temporaryLink}" alt="${esc(images[0].name)}" loading="lazy">
                    </div>
                    <div class="about-image-wrapper offset-down reveal">
                        <img src="${images[1].temporaryLink}" alt="${esc(images[1].name)}" loading="lazy">
                    </div>
                `;
            } else if (images.length === 1) {
                imagesHtml = `
                    <div class="about-image-wrapper reveal">
                        <img src="${images[0].temporaryLink}" alt="${esc(images[0].name)}" loading="lazy">
                    </div>
                `;
            } else {
                imagesHtml = `
                    <div class="about-image-wrapper offset-up reveal">
                        <img src="images/casa-mainumby-grupo-culata-jovai_16.jpg" alt="Nuestro Estudio" loading="lazy">
                    </div>
                    <div class="about-image-wrapper offset-down reveal">
                        <img src="images/casa-mainumby-grupo-culata-jovai_2.jpg" alt="Nuestro Equipo" loading="lazy">
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="about-grid">
                    <div class="about-content">
                        <span class="about-label reveal">${labelText}</span>
                        ${textLead ? `<div class="about-text-lead reveal"><p>${esc(textLead)}</p></div>` : ''}
                        ${textSecondary ? `<div class="about-text-secondary reveal"><p>${esc(textSecondary).replace(/&lt;br&gt;/g, '<br>')}</p></div>` : ''}
                    </div>
                    <div class="about-images">
                        ${imagesHtml}
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                if(typeof observer !== 'undefined') {
                    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                }
            }, 100);
        }

        function loadSobreContent(lang) {
            const container = document.getElementById('personCards');
            if (!container) return;

            const staticTexts = [
                "En Grupo Culata Jovái Arquitectos creemos en una arquitectura que trasciende el espacio físico. Buscamos la perfecta armonía entre el entorno, la funcionalidad y la estética contemporánea.",
                "Nuestro equipo está dedicado a transformar ideas en realidades tangibles, creando espacios atemporales con un profundo respeto por los materiales y la luz natural."
            ];

            renderAboutGrid(container, staticTexts, []);
        }

        // Sistema de traducción
        const translations = {
            es: { 'nav-trabajos': 'trabajos', 'nav-sobre': 'sobre', 'nav-contacto': 'contacto', 'about-title': 'Sobre' },
            en: { 'nav-trabajos': 'works', 'nav-sobre': 'about', 'nav-contacto': 'contact', 'about-title': 'About' },
            de: { 'nav-trabajos': 'arbeiten', 'nav-sobre': 'über', 'nav-contacto': 'kontakt', 'about-title': 'Über' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
            loadSobreContent(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            const lang = localStorage.getItem('selectedLanguage') || 'es';
            loadSobreContent(lang);
        });
    </script>
</body>
</html>
