<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="landing-header" id="header">
        <nav>
            <a href="trabajos.html" class="nav-link" data-i18n="nav-trabajos">trabajos</a>
            <a href="sobre.html" class="nav-link" data-i18n="nav-sobre">sobre</a>
            <a href="contacto.html" class="nav-link" data-i18n="nav-contacto">contacto</a>
        </nav>
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <!-- NOSOTROS -->
    <section id="nosotros" class="fade-in">
        <div class="nosotros-container">
            <h2 class="nosotros-title reveal" data-i18n="about-title">Sobre</h2>
            <div id="personCards" class="about-stack">
                <!-- Se llena dinámicamente desde Dropbox -->
            </div>
        </div>
    </section>

    <!-- SELECTOR DE IDIOMA -->
    <div class="language-selector" style="position: fixed; bottom: 30px; right: 30px; z-index: 200;">
        <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
        <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
        <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="dropbox-config.js"></script>
    <script src="dropbox-service-vercel.js"></script>
    <script>
        let sobreImages = [];

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text || '';
            return d.innerHTML;
        }

        function parseStructuredBlocks(text) {
            const lines = (text || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            const blocks = [];

            for (const line of lines) {
                if (/^image\s*:/i.test(line)) {
                    const value = line.replace(/^image\s*:/i, '').trim();
                    if (value) blocks.push({ type: 'image', value });
                } else if (/^text\s*:/i.test(line)) {
                    const value = line.replace(/^text\s*:/i, '').trim();
                    if (value) blocks.push({ type: 'text', value });
                }
            }

            return blocks;
        }

        function renderStructuredBlocks(container, blocks) {
            const imageByName = new Map(
                (sobreImages || []).map(item => [String(item.name || '').toLowerCase(), item])
            );

            container.innerHTML = blocks.map(block => {
                if (block.type === 'image') {
                    const img = imageByName.get(String(block.value || '').toLowerCase());
                    if (!img) return '';
                    return `<div class="about-block image reveal"><img src="${img.temporaryLink}" alt="${esc(img.name)}"></div>`;
                }

                return `<div class="about-block text reveal"><p>${esc(block.value)}</p></div>`;
            }).join('');
            
            // Re-observe with IntersectionObserver from script.js
            setTimeout(() => {
                if(typeof observer !== 'undefined') {
                    document.querySelectorAll('.about-block').forEach(el => observer.observe(el));
                }
            }, 100);
        }

        async function loadSobreContent(lang) {
            const container = document.getElementById('personCards');
            if (!container) return;

            try {
                const langKey = lang === 'en' ? 'sobre_en' : lang === 'de' ? 'sobre_de' : 'sobre_es';
                let text = null;
                try { text = await dropboxService.getSiteContent(langKey, { noCache: true }); } catch (_) {}
                if (!text || !text.trim()) {
                    try { text = await dropboxService.getSiteContent('sobre', { noCache: true }); } catch (_) {}
                }

                const structuredBlocks = parseStructuredBlocks(text || '');
                if (structuredBlocks.length) {
                    renderStructuredBlocks(container, structuredBlocks);
                    return;
                }

                const paragraphs = text
                    ? text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
                    : [];

                if (!paragraphs.length) {
                    container.innerHTML = `
                        <div class="about-block text reveal">
                            <p>En Grupo Culata Jovái Arquitectos creemos en una arquitectura que trasciende el espacio físico. Buscamos la perfecta armonía entre el entorno, la funcionalidad y la estética contemporánea.</p>
                        </div>
                        <div class="about-block text reveal">
                            <p>Nuestro equipo está dedicado a transformar ideas en realidades tangibles, creando espacios atemporales con un profundo respeto por los materiales y la luz natural.</p>
                        </div>
                        <div class="about-block image reveal">
                            <img src="images/casa-mainumby-grupo-culata-jovai_16.jpg" alt="Nuestro Estudio">
                        </div>
                    `;
                    setTimeout(() => {
                        if(typeof observer !== 'undefined') {
                            document.querySelectorAll('.about-block, .reveal').forEach(el => observer.observe(el));
                        }
                    }, 100);
                    return;
                }

                container.innerHTML = paragraphs.map((bio, i) => {
                    const img = sobreImages[i];
                    const photoHtml = img
                        ? `<div class="about-block image reveal"><img src="${img.temporaryLink}" alt=""></div>`
                        : '';
                    const textHtml = bio.split(/\n/).map(line => `<div class="about-block text reveal"><p>${esc(line)}</p></div>`).join('');
                    return `${photoHtml}${textHtml}`;
                }).join('');
                
                // Re-observe with IntersectionObserver from script.js
                setTimeout(() => {
                    if(typeof observer !== 'undefined') {
                        document.querySelectorAll('.about-block').forEach(el => observer.observe(el));
                    }
                }, 100);

            } catch (error) {
                console.error('No se pudo cargar el contenido de Sobre:', error);
            }
        }

        // Sistema de traducción
        const translations = {
            es: { 'nav-trabajos': 'trabajos', 'nav-sobre': 'sobre', 'nav-contacto': 'contacto', 'about-title': 'Sobre' },
            en: { 'nav-trabajos': 'works', 'nav-sobre': 'about', 'nav-contacto': 'contact', 'about-title': 'About' },
            de: { 'nav-trabajos': 'arbeiten', 'nav-sobre': 'über', 'nav-contacto': 'kontakt', 'about-title': 'Über' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
            loadSobreContent(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', async () => {
            initLanguage();
            const lang = localStorage.getItem('selectedLanguage') || 'es';
            try { sobreImages = await dropboxService.getSobreImages({ noCache: true }); } catch (_) {}
            loadSobreContent(lang);
        });
    </script>
</body>
</html>
