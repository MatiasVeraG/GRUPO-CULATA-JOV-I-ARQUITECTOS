<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="landing-header" id="header">
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <!-- GALERÍA DE PROYECTOS -->
    <main class="gallery-container fade-in">
        <div class="gallery-header reveal">
            <h1>Proyectos</h1>
            <p class="gallery-subtitle">Arquitectura que transforma espacios</p>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <div class="loading-container">
                <div class="loading">Cargando proyectos...</div>
            </div>
        </div>
    </main>

    <!-- MODAL DE PROYECTO -->
    <div class="modal" id="projectModal">
        <div class="modal-content" style="max-height: 95vh; overflow-y: auto; padding: 0; background: rgba(255,255,255,0.98);">
            <div style="position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 10;">
                <h2 style="margin: 0; font-size: 16px; letter-spacing: 2px; color: #000;" id="modalTitle"></h2>
                <button onclick="closeProjectModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #000;">✕</button>
            </div>
            <div class="modal-gallery" id="modalGallery"></div>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">✕</span>
        <span class="lightbox-nav lightbox-prev" onclick="prevImage()">‹</span>
        <div class="lightbox-content"><img id="lightboxImage" src="" alt=""></div>
        <span class="lightbox-nav lightbox-next" onclick="nextImage()">›</span>
    </div>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
    <script src="dropbox-config.js"></script>
    <script src="dropbox-service-vercel.js"></script>
    <script>
        var currentProject = null;
        var currentImages = [];
        var currentImageIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            loadProjectsFromDropbox();
        });

        async function loadProjectsFromDropbox() {
            const grid = document.getElementById('projectsGrid');
            try {
                const projects = await dropboxService.getAllProjectsWithCovers();

                if (projects.length === 0) {
                    grid.innerHTML = '<div class="loading">No se encontraron proyectos</div>';
                    return;
                }

                grid.innerHTML = projects.map((project, index) => `
                    <div class="project-item reveal" style="transition-delay: ${(index % 3) * 0.15}s" onclick="openProject('${project.path}', '${escapeHtml(project.name)}')">
                        ${project.cover 
                            ? `<img src="${project.cover}" alt="${escapeHtml(project.name)}" loading="lazy">`
                            : `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#f0f0f0;color:#999;font-size:12px;letter-spacing:1px;text-transform:uppercase;">Sin imágenes</div>`
                        }
                        <div class="project-overlay">
                            <span style="font-size: 14px;">${escapeHtml(project.name)}</span>
                        </div>
                    </div>
                `).join('');
                
                setTimeout(() => {
                    if(typeof observer !== 'undefined') document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                }, 100);

            } catch (error) {
                console.error('Error al cargar proyectos:', error);
                grid.innerHTML = `<div class="loading">Error: ${escapeHtml(error.message)}</div>`;
            }
        }

        async function openProject(projectPath, projectName) {
            const modal = document.getElementById('projectModal');
            const gallery = document.getElementById('modalGallery');
            const title = document.getElementById('modalTitle');

            currentProject = projectPath;
            title.textContent = projectName;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            gallery.innerHTML = '<div class="loading" style="grid-column: 1/-1;">Cargando imágenes...</div>';

            try {
                const images = await dropboxService.getProjectImages(projectPath);
                currentImages = images;

                if (images.length === 0) {
                    gallery.innerHTML = '<div class="loading" style="grid-column: 1/-1;">No hay imágenes</div>';
                    return;
                }

                gallery.innerHTML = images.map((image, index) => `
                    <img 
                        src="${image.temporaryLink}" 
                        alt="${escapeHtml(image.name)}"
                        class="modal-image reveal"
                        style="transition-delay: ${(index % 3) * 0.1}s"
                        loading="lazy"
                        onclick="openLightbox(${index})"
                    >
                `).join('');
                
                setTimeout(() => {
                    if(typeof observer !== 'undefined') document.querySelectorAll('.modal-image.reveal').forEach(el => observer.observe(el));
                }, 100);

            } catch (error) {
                console.error('Error al cargar imágenes:', error);
                gallery.innerHTML = `<div class="loading" style="grid-column: 1/-1;">Error: ${escapeHtml(error.message)}</div>`;
            }
        }

        function closeProjectModal() {
            const modal = document.getElementById('projectModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentProject = null;
            currentImages = [];
        }

        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImage');
            
            img.src = currentImages[index].temporaryLink;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function prevImage() {
            if (currentImages.length === 0) return;
            currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
            document.getElementById('lightboxImage').src = currentImages[currentImageIndex].temporaryLink;
        }

        function nextImage() {
            if (currentImages.length === 0) return;
            currentImageIndex = (currentImageIndex + 1) % currentImages.length;
            document.getElementById('lightboxImage').src = currentImages[currentImageIndex].temporaryLink;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('lightbox').classList.contains('active')) {
                    closeLightbox();
                } else if (document.getElementById('projectModal').classList.contains('active')) {
                    closeProjectModal();
                }
            }
            if (document.getElementById('lightbox').classList.contains('active')) {
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });
    </script>
</body>
</html>
