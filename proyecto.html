<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="landing-header" id="header">
        <nav>
            <a href="trabajos.html" class="nav-link" data-i18n="nav-trabajos">trabajos</a>
            <a href="sobre.html" class="nav-link" data-i18n="nav-sobre">sobre</a>
            <a href="contacto.html" class="nav-link" data-i18n="nav-contacto">contacto</a>
        </nav>
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <main class="project-page fade-in" id="projectContent">
        <div class="loading">Cargando proyecto...</div>
    </main>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#8249;</span>
        <div class="lightbox-content"><img id="lightboxImage" src="" alt=""></div>
        <span class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#8250;</span>
        <span class="lightbox-counter" id="lightboxCounter"></span>
    </div>

    <footer id="projectFooter" style="background-color:#000;color:#fff;text-align:center;padding:40px 20px;font-size:10px;letter-spacing:2px;margin-top:80px;display:none;">
        <p>© 2026 GRUPO CULATA JOVÁI ARQUITECTOS</p>
    </footer>

    <div class="language-selector" style="position: fixed; bottom: 30px; right: 30px; z-index: 200;">
        <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
        <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
        <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
    </div>

    <script src="script.js"></script>
    <script src="dropbox-config.js"></script>
    <script src="dropbox-service-vercel.js"></script>
    <script>
        var currentProject = null;
        var allImages = [];
        var currentImageIndex = 0;
        var slideshowIndex = 0;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function getPathFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            return path ? decodeURIComponent(path) : null;
        }

        function getSourceFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('source') || '';
        }

        async function resolveProjectPath() {
            const directPath = getPathFromUrl();
            if (directPath) return directPath;

            const params = new URLSearchParams(window.location.search);
            const slug = params.get('proyecto') || params.get('slug');
            if (!slug) return null;
            
            try {
                const projects = await dropboxService.listProjects();
                const found = projects.find(p => p.slug === slug);
                return found ? found.path : slug; // Retorna el slug como ID de fallback si falla
            } catch (error) {
                return slug; // Usamos el ID de la URL como fallback
            }
        }

        async function loadProjectData() {
            try {
                const projectPathOrId = await resolveProjectPath();
                if (!projectPathOrId) {
                    document.getElementById('projectContent').innerHTML = '<div class="loading">Proyecto no encontrado</div>';
                    return;
                }

                const source = getSourceFromUrl();
                const footer = document.getElementById('projectFooter');
                if (footer) {
                    footer.style.display = source === 'trabajos' ? 'none' : 'block';
                }

                try {
                    // Intento de cargar desde API
                    if (String(projectPathOrId).startsWith('/')) {
                        currentProject = await dropboxService.getProjectDetail(projectPathOrId);
                    } else {
                        throw new Error("Local ID provided, skipping API");
                    }
                } catch (error) {
                    console.warn("Usando fallback local para proyecto:", projectPathOrId);
                    if (typeof getProjects === 'function') {
                        const localProjects = getProjects();
                        const found = localProjects.find(p => String(p.id) === String(projectPathOrId));
                        if (found) {
                            currentProject = {
                                name: found.title,
                                description: found.description || "Descripción del proyecto.",
                                features: [{key: "Estado", value: "Terminado"}, {key: "Ubicación", value: "Local"}],
                                images: (found.images || []).map(img => ({ temporaryLink: img, name: 'Imagen' })),
                                drawings: []
                            };
                        } else {
                            throw new Error("Proyecto no encontrado en datos locales");
                        }
                    } else {
                        throw error;
                    }
                }

                renderProject();
                document.title = `${currentProject.name} - Grupo Culata Jovái Arquitectos`;
            } catch (error) {
                console.error(error);
                document.getElementById('projectContent').innerHTML = `<div class="loading">Error al cargar el proyecto: ${escapeHtml(error.message)}</div>`;
            }
        }

        function renderProject() {
            const content = document.getElementById('projectContent');
            const images = currentProject.images || [];
            const drawings = currentProject.drawings || [];

            allImages = [
                ...images.map(i => i.temporaryLink),
                ...drawings.map(d => d.temporaryLink)
            ];

            const datosHTML = (currentProject.features || []).map(item => {
                return `<div class="project-datos-item reveal"><span class="project-datos-label">${escapeHtml(item.key)}</span><span class="project-datos-value">${escapeHtml(item.value || '')}</span></div>`;
            }).join('');

            const lang = localStorage.getItem('selectedLanguage') || 'es';
            const descriptionText = (
                lang === 'en' ? currentProject.description_en :
                lang === 'de' ? currentProject.description_de :
                currentProject.description_es
            || currentProject.description || '').trim();
            const descriptionHTML = descriptionText
                ? descriptionText.split(/\n\s*\n/).map(p => `<p class="reveal">${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('')
                : '<p class="reveal">Sin descripción disponible.</p>';

            const slidesHTML = images.length
                ? images.map((img, index) => `<div class="slideshow-slide"><img src="${img.temporaryLink}" alt="${escapeHtml(currentProject.name)}" loading="${index === 0 ? 'eager' : 'lazy'}" onclick="openLightbox(${index})"></div>`).join('')
                : '<div class="slideshow-slide"><div style="height:85vh;display:flex;align-items:center;justify-content:center;color:#999;letter-spacing:1px;text-transform:uppercase;">Sin imágenes</div></div>';

            let drawingsHTML = '';
            if (drawings.length) {
                drawingsHTML = `
                    <div class="drawings-wrap">
                        <h3 class="planos-title reveal">Planos</h3>
                        <div class="drawings-grid">
                            ${drawings.map((item, idx) => `<div class="drawing-item reveal" onclick="openLightbox(${images.length + idx})"><img src="${item.temporaryLink}" alt="Plano" loading="lazy"></div>`).join('')}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="back-wrap reveal"><a href="trabajos.html" class="back-button">&larr; volver a trabajos</a></div>
                <div class="project-slideshow reveal">
                    <div class="slideshow-track" id="slideshowTrack">${slidesHTML}</div>
                    ${images.length > 1 ? `
                        <button class="slideshow-btn slideshow-prev" onclick="slideshowMove(-1)">&#8249;</button>
                        <button class="slideshow-btn slideshow-next" onclick="slideshowMove(1)">&#8250;</button>
                        <span class="slideshow-counter" id="slideshowCounter">1 / ${images.length}</span>
                    ` : ''}
                </div>
                <div class="project-info">
                    <aside class="project-sidebar">
                        <h1 class="project-title reveal">${escapeHtml(currentProject.name)}</h1>
                        <div class="project-datos">${datosHTML}</div>
                    </aside>
                    <div class="project-description-wrap">
                        <div class="project-description" id="projectDescription">${descriptionHTML}</div>
                    </div>
                </div>
                ${drawingsHTML}
            `;

            slideshowIndex = 0;
            
            setTimeout(() => {
                if(typeof observer !== 'undefined') document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            }, 100);
        }

        function slideshowMove(dir) {
            const images = currentProject.images || [];
            if (images.length < 2) return;
            slideshowIndex = (slideshowIndex + dir + images.length) % images.length;
            document.getElementById('slideshowTrack').style.transform = `translateX(-${slideshowIndex * 100}%)`;
            document.getElementById('slideshowCounter').textContent = `${slideshowIndex + 1} / ${images.length}`;
        }

        function openLightbox(index) {
            if (!allImages.length) return;
            currentImageIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            if (!allImages.length) return;
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = allImages.length - 1;
            if (currentImageIndex >= allImages.length) currentImageIndex = 0;
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightboxImage').src = allImages[currentImageIndex];
            document.getElementById('lightboxCounter').textContent = `${currentImageIndex + 1} / ${allImages.length}`;
        }

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            }
        });

        const translations = {
            es: { 'nav-trabajos': 'trabajos', 'nav-sobre': 'sobre', 'nav-contacto': 'contacto' },
            en: { 'nav-trabajos': 'works', 'nav-sobre': 'about', 'nav-contacto': 'contact' },
            de: { 'nav-trabajos': 'arbeiten', 'nav-sobre': 'über', 'nav-contacto': 'kontakt' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.classList.toggle('active', opt.getAttribute('data-lang') === lang);
            });
            const t = translations[lang] || translations.es;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            if (currentProject) {
                const raw = (
                    lang === 'en' ? currentProject.description_en :
                    lang === 'de' ? currentProject.description_de :
                    currentProject.description_es
                || currentProject.description || '').trim();
                const html = raw
                    ? raw.split(/\n\s*\n/).map(p => `<p class="reveal">${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('')
                    : '<p class="reveal">Sin descripción disponible.</p>';
                const el = document.getElementById('projectDescription');
                if (el) el.innerHTML = html;
                
                setTimeout(() => {
                    if(typeof observer !== 'undefined') document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                }, 100);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProjectData();
            changeLanguage(localStorage.getItem('selectedLanguage') || 'es');
        });
    </script>
</body>
</html>
