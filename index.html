<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Culata Jovái Arquitectos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html, body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FFFFFF;
            overflow-x: hidden;
            overflow-y: hidden;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* SPLIT LAYOUT */
        .main-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
        }

        .sidebar {
            width: clamp(280px, 25%, 380px);
            height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .carousel-container {
            width: calc(100vw - clamp(280px, 25%, 380px));
            height: 100vh;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* CAROUSEL SLIDES */
        .carousel-slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            z-index: 0;
            transition: opacity 1s ease-in-out;
        }

        .carousel-slide.last-active {
            opacity: 1;
            z-index: 1;
            transition: opacity 1s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .carousel-slide img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            cursor: default;
            z-index: 1;
            transform: scale(1);
            transition: transform 6s ease-out;
        }

        .carousel-slide.active img {
            transform: scale(1.05);
        }

        @media (prefers-reduced-motion: reduce) {
            .carousel-slide {
                transition: opacity 0.2s ease-in-out;
            }
            .carousel-slide img, .carousel-slide.active img {
                transition: none;
                transform: scale(1);
            }
        }

        /* SIDEBAR CONTENT */
        .logo-text {
            cursor: pointer;
            height: 35px;
            display: flex;
            align-items: center;
        }

        .logo-text img {
            height: 100%;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .logo-text:hover img {
            opacity: 0.7;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 30px;
        }

        .contact-info p {
            font-size: 12px;
            letter-spacing: 2px;
            line-height: 1.6;
            text-transform: uppercase;
            font-weight: 400;
        }

        .contact-info strong {
            font-weight: 700;
            font-size: 14px;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--accent-color);
        }

        .contact-block {
            padding-bottom: 30%;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .social-links-text {
            display: flex;
            flex-direction: column;
            gap: 70px;
        }

        .social-links-text a {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .social-links-text a:hover {
            opacity: 0.7;
        }

        .language-selector {
            display: flex;
            gap: 16px;
        }

        .lang-option {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-color);
            opacity: 0.5;
            text-decoration: none;
            text-transform: lowercase;
            cursor: pointer;
            transition: opacity 0.3s ease;
            font-weight: 400;
        }

        .lang-option:hover, .lang-option.active {
            opacity: 1;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            .carousel-container {
                width: 100vw;
                height: 60vh;
                order: 1; /* Carousel at the top */
            }

            .sidebar {
                width: 100vw;
                height: 40vh;
                padding: 24px;
                order: 2; /* Sidebar below */
                overflow-y: auto;
            }

            .logo-text {
                height: 28px;
                margin-bottom: 24px;
            }

            .contact-block,
            .contact-info,
            .social-links-text {
                gap: 16px;
            }
            
            .contact-block {
                margin-bottom: 24px;
            }

            .sidebar-footer {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-text" onclick="window.location.href='index.html'">
                <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
            </div>

            <div class="contact-block">
                <div class="contact-info">
                    <p><strong data-i18n="contact-address">Dirección</strong><br>Asunción, Paraguay</p>
                    <p><strong>Email</strong><br><a href="mailto:contacto@culatajovai.com">contacto@culatajovai.com</a></p>
                    <p><strong data-i18n="contact-phone">Teléfono</strong><br><a href="tel:+595999000000">+595 999 000 000</a></p>
                </div>

                <div class="social-links-text">
                    <a href="https://www.instagram.com" target="_blank">Instagram</a>
                    <a href="https://www.facebook.com" target="_blank">Facebook</a>
                </div>
            </div>

            <div class="sidebar-footer">

                <div class="language-selector">
                    <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
                    <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
                    <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
                </div>
            </div>
        </aside>

        <!-- CAROUSEL -->
        <div class="carousel-container" id="carouselContainer">
            <!-- Slides se generarán dinámicamente -->
        </div>
    </div>

    <script>
        // Sistema de traducción
        const translations = {
            es: { 'contact-address': 'Dirección', 'contact-phone': 'Teléfono' },
            en: { 'contact-address': 'Address', 'contact-phone': 'Phone' },
            de: { 'contact-address': 'Adresse', 'contact-phone': 'Telefon' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Obtener portadas de los proyectos de forma estática (sin backend)
        // Obtener portadas de los proyectos de forma estática (sin backend)
        async function getCarouselImages() {
            return [
                { cover: 'images/casa miralgo/casa-miralago-grupo-culata-jovai_21.jpg', title: 'Casa Miralago' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_16.jpg', title: 'Casa Mainumby' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_11.jpg', title: 'Casa Mainumby' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_14.jpg', title: 'Casa Mainumby' },
                { cover: 'images/vivienda gt/30-vivienda-gt-grupo-culata-jovai-c-federico-cairoli-low.jpg', title: 'Vivienda GT' },
                { cover: 'images/casa miralgo/casa-miralago-grupo-culata-jovai_16.jpg', title: 'Casa Miralago' }
            ];
        }

        // Crear slides del carousel
        async function createCarousel() {
            const projects = await getCarouselImages();
            const container = document.getElementById('carouselContainer');

            if (projects.length === 0) {
                container.innerHTML = '<div class="loading">No hay proyectos disponibles</div>';
                return;
            }
            
            container.innerHTML = '';

            projects.forEach((project, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide' + (index === 0 ? ' active' : '');
                
                if (project.cover) {
                    slide.innerHTML = `<img src="${project.cover}" alt="${project.title}">`;
                } else {
                    slide.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#999;letter-spacing:1px;text-transform:uppercase;">Sin portada</div>`;
                }
                
                container.appendChild(slide);
            });
        }

        let currentSlide = 0;
        let lastSlideIndex = -1;

        function showSlide(index) {
            const slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            
            slides.forEach(slide => {
                slide.classList.remove('active', 'last-active');
            });
            
            if (lastSlideIndex !== -1 && slides[lastSlideIndex]) {
                slides[lastSlideIndex].classList.add('last-active');
            }
            
            if (slides[index]) {
                slides[index].classList.add('active');
            }
            
            lastSlideIndex = index;
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        function prevSlide() {
            const slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(currentSlide);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Auto-avance con intervalo de permanencia de 5s
        let autoSlide = setInterval(nextSlide, 5000);

        // Inicializar carousel
        createCarousel();

        // Inicializar idioma
        initLanguage();
    </script>
</body>
</html>
