<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Culata Jovái Arquitectos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html, body {
            font-family: 'Futura', 'Century Gothic', sans-serif;
            background-color: #FFFFFF;
            overflow-x: hidden;
            overflow-y: hidden;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER MINIMALISTA */
        .landing-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 30px 60px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%);
            pointer-events: none;
        }
        
        .landing-header > * {
            pointer-events: auto;
        }

        .hero-zone {
            /* no longer needed for flex, just a wrapper */
        }

        .logo-text {
            cursor: pointer;
            height: 35px;
            display: flex;
            align-items: center;
        }

        .logo-text img {
            height: 100%;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .logo-text:hover img {
            opacity: 0.7;
        }

        .nav-link {
            font-size: 11px;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #DC143C;
        }

        /* CAROUSEL */
        .carousel-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            overflow: hidden;
            z-index: 1;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            cursor: default;
            z-index: 1;
        }

        .floating-contact {
            position: absolute;
            top: 50%;
            left: 60px;
            transform: translateY(-50%);
            z-index: 10;
            color: #fff;
            pointer-events: none;
        }
        .floating-contact p {
            font-size: 14px;
            letter-spacing: 2px;
            line-height: 2;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .floating-contact strong {
            font-weight: 700;
            font-size: 18px;
        }
        .floating-contact a {
            color: #fff;
            text-decoration: none;
        }

        .carousel-nav-buttons {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }
        .carousel-control {
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .carousel-control:hover {
            background: rgba(255, 255, 255, 1);
            color: #DC143C;
            transform: scale(1.1);
        }

        .bottom-controls {
            position: fixed;
            bottom: 30px;
            left: 60px;
            right: 60px;
            width: auto;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 100;
            pointer-events: none;
        }
        .bottom-controls > * {
            pointer-events: auto;
        }

        /* SELECTOR DE IDIOMA */
        .language-selector {
            display: flex;
            gap: 10px;
        }

        /* BOTONES DE REDES SOCIALES */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .social-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .social-btn svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .lang-option {
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            text-transform: lowercase;
            cursor: pointer;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .lang-option:hover {
            color: #ffffff;
        }

        .lang-option.active {
            color: #ffffff;
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .landing-header {
                padding: 20px 30px;
            }

            .logo-text {
                height: 28px;
            }

            .nav-link {
                font-size: 8px;
            }

            .carousel-container {
                /* already 100vw, 100vh on mobile */
            }

            .hero-zone {
                /* wrapper */
            }

            .bottom-controls {
                left: 20px;
                right: 20px;
                bottom: 20px;
            }

            .carousel-slide img {
                object-fit: cover;
                object-position: center center;
            }

            .floating-contact {
                top: auto;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
                width: 90%;
            }
            .floating-contact p {
                font-size: 11px;
                margin-bottom: 8px;
            }
            .floating-contact strong {
                font-size: 13px;
            }

            .carousel-nav-buttons {
                right: 20px;
                gap: 10px;
            }
            .carousel-control {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .language-selector {
                gap: 8px;
            }

            .lang-option {
                font-size: 9px;
            }

            .social-buttons {
                gap: 10px;
            }

            .social-btn {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 480px) {
            .landing-header {
                padding: 15px 20px;
            }

            .logo-text {
                height: 24px;
            }

            .carousel-container {
                /* already 100vw */
            }

            .bottom-controls {
                left: 10px;
                right: 10px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="landing-header">

        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo_blanco.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <div class="hero-zone">
        <!-- SIDE CONTACT INFO -->
        <div class="floating-contact">
            <p><strong data-i18n="contact-address">Dirección</strong><br>Asunción, Paraguay</p>
            <p><strong>Email</strong><br><a href="mailto:contacto@culatajovai.com">contacto@culatajovai.com</a></p>
            <p><strong data-i18n="contact-phone">Teléfono</strong><br><a href="tel:+595999000000">+595 999 000 000</a></p>
            <p><a href="https://instagram.com/culatajovai" target="_blank">Instagram</a></p>
        </div>

        <!-- CAROUSEL -->
        <div class="carousel-container" id="carouselContainer">
            <!-- Slides se generarán dinámicamente -->
        </div>

        <!-- CAROUSEL CONTROLS -->
        <div class="carousel-nav-buttons">
            <button class="carousel-control" onclick="prevSlide()" aria-label="Anterior">&#10094;</button>
            <button class="carousel-control" onclick="nextSlide()" aria-label="Siguiente">&#10095;</button>
        </div>

        <div class="bottom-controls reveal">
            <!-- BOTONES DE REDES SOCIALES -->
            <div class="social-buttons">
                <a href="https://www.facebook.com" target="_blank" class="social-btn" aria-label="Facebook">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </a>
                <a href="https://www.instagram.com" target="_blank" class="social-btn" aria-label="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </a>
            </div>

            <!-- SELECTOR DE IDIOMA -->
            <div class="language-selector">
                <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
                <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
                <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
            </div>
        </div>
    </div>

    <script>
        // Sistema de traducción
        const translations = {
            es: { 'contact-address': 'Dirección', 'contact-phone': 'Teléfono' },
            en: { 'contact-address': 'Address', 'contact-phone': 'Phone' },
            de: { 'contact-address': 'Adresse', 'contact-phone': 'Telefon' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Obtener portadas de los proyectos de forma estática (sin backend)
        // Obtener portadas de los proyectos de forma estática (sin backend)
        async function getCarouselImages() {
            return [
                { cover: 'images/casa miralgo/casa-miralago-grupo-culata-jovai_21.jpg', title: 'Casa Miralago' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_16.jpg', title: 'Casa Mainumby' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_11.jpg', title: 'Casa Mainumby' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_14.jpg', title: 'Casa Mainumby' },
                { cover: 'images/vivienda gt/30-vivienda-gt-grupo-culata-jovai-c-federico-cairoli-low.jpg', title: 'Vivienda GT' },
                { cover: 'images/casa miralgo/casa-miralago-grupo-culata-jovai_16.jpg', title: 'Casa Miralago' }
            ];
        }

        // Crear slides del carousel
        async function createCarousel() {
            const projects = await getCarouselImages();
            const container = document.getElementById('carouselContainer');

            if (projects.length === 0) {
                container.innerHTML = '<div class="loading">No hay proyectos disponibles</div>';
                return;
            }
            
            container.innerHTML = '';

            projects.forEach((project, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide' + (index === 0 ? ' active' : '');
                
                if (project.cover) {
                    slide.innerHTML = `<img src="${project.cover}" alt="${project.title}">`;
                } else {
                    slide.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#999;letter-spacing:1px;text-transform:uppercase;">Sin portada</div>`;
                }
                
                container.appendChild(slide);
            });
        }

        let currentSlide = 0;

        function showSlide(index) {
            const slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            
            slides.forEach(slide => slide.classList.remove('active'));
            if (slides[index]) slides[index].classList.add('active');
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        function prevSlide() {
            const slides = document.querySelectorAll('.carousel-slide');
            if(slides.length === 0) return;
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(currentSlide);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Auto-avance ininterrumpido
        let autoSlide = setInterval(nextSlide, 12000);

        // Pausar auto-avance al hover (desactivado para controles en pantalla)
        // document.getElementById('carouselContainer').addEventListener('mouseenter', () => {
        //     clearInterval(autoSlide);
        // });

        document.getElementById('carouselContainer').addEventListener('mouseleave', () => {
            autoSlide = setInterval(nextSlide, 5000);
        });

        // Inicializar carousel
        createCarousel();

        // Inicializar idioma
        initLanguage();
    </script>
</body>
</html>
