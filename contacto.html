<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="landing-header" id="header">
        <nav>
            <a href="trabajos.html" class="nav-link" data-i18n="nav-trabajos">trabajos</a>
            <a href="sobre.html" class="nav-link" data-i18n="nav-sobre">sobre</a>
            <a href="contacto.html" class="nav-link" data-i18n="nav-contacto">contacto</a>
        </nav>
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <!-- CONTACTO -->
    <section id="contacto" class="fade-in">
        <div style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 var(--space-4);">
            <div class="contacto-content" id="contactoInfoEditable" style="width: 100%;"></div>
        </div>
    </section>

    <!-- SELECTOR DE IDIOMA -->
    <div class="language-selector" style="position: fixed; bottom: 30px; right: 30px; z-index: 200;">
        <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
        <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
        <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
    </div>

    <script src="script.js"></script>
    <script src="dropbox-config.js"></script>
    <script src="dropbox-service-vercel.js"></script>
    <script>
        let contactoImages = [];

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text || '';
            return d.innerHTML;
        }

        function parseStructuredBlocks(text) {
            const lines = (text || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            const blocks = [];

            for (const line of lines) {
                if (/^image\s*:/i.test(line)) {
                    const value = line.replace(/^image\s*:/i, '').trim();
                    if (value) blocks.push({ type: 'image', value });
                } else if (/^text\s*:/i.test(line)) {
                    const value = line.replace(/^text\s*:/i, '').trim();
                    if (value) blocks.push({ type: 'text', value });
                }
            }

            return blocks;
        }

        function renderContactGrid(container, infoHtml) {
            const lang = localStorage.getItem('selectedLanguage') || 'es';
            const labelText = lang === 'en' ? 'LET\\'S TALK' : 
                            lang === 'de' ? 'LASS UNS REDEN' : 
                            'HABLEMOS';
                            
            const formLabels = {
                es: { name: 'Nombre', email: 'Correo Electrónico', message: 'Mensaje', send: 'ENVIAR MENSAJE', success: '¡Mensaje enviado con éxito!' },
                en: { name: 'Name', email: 'Email', message: 'Message', send: 'SEND MESSAGE', success: 'Message sent successfully!' },
                de: { name: 'Name', email: 'E-Mail', message: 'Nachricht', send: 'NACHRICHT SENDEN', success: 'Nachricht erfolgreich gesendet!' }
            };
            const labels = formLabels[lang] || formLabels.es;

            container.innerHTML = `
                <div class="contact-grid">
                    <div class="contact-info-col">
                        <span class="about-label reveal">${labelText}</span>
                        ${infoHtml}
                    </div>
                    <div class="contact-form-col reveal">
                        <form id="contactForm" class="contact-form" onsubmit="handleContactSubmit(event)">
                            <div class="form-group">
                                <label for="name" class="form-label">${labels.name}</label>
                                <input type="text" id="name" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="email" class="form-label">${labels.email}</label>
                                <input type="email" id="email" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="message" class="form-label">${labels.message}</label>
                                <textarea id="message" class="form-textarea" required></textarea>
                            </div>
                            <button type="submit" class="form-submit" id="submitBtn">
                                <span class="btn-text">${labels.send}</span>
                                <span class="btn-loader" style="display:none;">...</span>
                            </button>
                            <div id="formSuccess" class="form-success" style="display:none; color: var(--accent-color); margin-top: 16px; font-size: 14px;">${labels.success}</div>
                        </form>
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                if(typeof observer !== 'undefined') document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            }, 100);
        }

        window.handleContactSubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.btn-loader');
            const success = document.getElementById('formSuccess');
            
            btn.classList.add('loading');
            text.style.display = 'none';
            loader.style.display = 'inline-block';
            
            setTimeout(() => {
                btn.classList.remove('loading');
                text.style.display = 'inline-block';
                loader.style.display = 'none';
                document.getElementById('contactForm').reset();
                success.style.display = 'block';
                
                setTimeout(() => {
                    success.style.display = 'none';
                }, 4000);
            }, 1500);
        };

        async function loadContactoContent(lang) {
            const container = document.getElementById('contactoInfoEditable');
            if (!container) return;

            try {
                const resolvedLang = lang || localStorage.getItem('selectedLanguage') || 'es';
                const langKey = resolvedLang === 'en' ? 'contacto_en' : resolvedLang === 'de' ? 'contacto_de' : 'contacto_es';
                let text = null;
                try { text = await dropboxService.getSiteContent(langKey, { noCache: true }); } catch (_) {}
                if (!text || !text.trim()) {
                    text = await dropboxService.getSiteContent('contacto', { noCache: true }).catch(() => null);
                }
                
                if (!text || !text.trim()) {
                    const fallbackInfoHtml = `
                        <div class="contacto-info reveal">
                            <p><strong>Dirección</strong><br>Asunción, Paraguay</p>
                        </div>
                        <div class="contacto-info reveal">
                            <p><strong>Email</strong><br><a href="mailto:contacto@culatajovai.com" class="social-link">contacto@culatajovai.com</a></p>
                        </div>
                        <div class="contacto-info reveal">
                            <p><strong>Teléfono</strong><br><a href="tel:+595999000000" class="social-link">+595 999 000 000</a></p>
                        </div>
                        <div class="contacto-info reveal" style="margin-top: 32px;">
                            <a href="https://instagram.com/culatajovai" target="_blank" class="social-link">Instagram</a>
                        </div>
                    `;
                    renderContactGrid(container, fallbackInfoHtml);
                    return;
                }

                const structuredBlocks = parseStructuredBlocks(text || '');
                if (structuredBlocks.length) {
                    const imageByName = new Map((contactoImages || []).map(item => [String(item.name || '').toLowerCase(), item]));
                    const infoHtml = structuredBlocks.map(block => {
                        if (block.type === 'image') return '';
                        return `<div class="contacto-info text reveal"><p>${esc(block.value)}</p></div>`;
                    }).join('');
                    renderContactGrid(container, infoHtml);
                    return;
                }

                const infoHtml = text
                    .split(/\n\s*\n/)
                    .map(item => item.trim())
                    .filter(Boolean)
                    .map(item => {
                        const lines = item.split(/\n/).map(l => l.trim()).filter(Boolean);
                        if (lines.length === 0) return '';
                        const title = lines[0];
                        const body = lines.slice(1).join('<br>');
                        return `<div class="contacto-info reveal"><p><strong>${title}</strong>${body ? `<br>${body}` : ''}</p></div>`;
                    })
                    .join('');

                if (infoHtml) {
                    renderContactGrid(container, infoHtml);
                }
            } catch (error) {
                console.error('No se pudo cargar el contenido de Contacto desde Dropbox:', error);
            }
        }

        async function loadContactoImages() {
            try {
                contactoImages = await dropboxService.getContactoImages({ noCache: true });
            } catch (_) {
                contactoImages = [];
            }
        }

        // Sistema de traducción
        const translations = {
            es: { 'nav-trabajos': 'trabajos', 'nav-sobre': 'sobre', 'nav-contacto': 'contacto', 'contact-title': 'Contacto' },
            en: { 'nav-trabajos': 'works', 'nav-sobre': 'about', 'nav-contacto': 'contact', 'contact-title': 'Contact' },
            de: { 'nav-trabajos': 'arbeiten', 'nav-sobre': 'über', 'nav-contacto': 'kontakt', 'contact-title': 'Kontakt' }
        };

        function updateDocumentTitle(lang) {
            const titles = {
                es: 'Contacto - Grupo Culata Jovái Arquitectos',
                en: 'Contact - Grupo Culata Jovái Arquitectos',
                de: 'Kontakt - Grupo Culata Jovái Arquitectos'
            };
            document.title = titles[lang] || titles.es;
        }

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
            updateDocumentTitle(lang);
            loadContactoContent(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
            updateDocumentTitle(savedLang);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initLanguage();
            await loadContactoImages();
            loadContactoContent(localStorage.getItem('selectedLanguage') || 'es');
        });
    </script>
</body>
</html>
