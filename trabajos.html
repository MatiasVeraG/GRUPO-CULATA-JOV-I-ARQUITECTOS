<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajos - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="landing-header" id="header">
        <nav>
            <a href="trabajos.html" class="nav-link" data-i18n="nav-trabajos">trabajos</a>
            <a href="sobre.html" class="nav-link" data-i18n="nav-sobre">sobre</a>
            <a href="contacto.html" class="nav-link" data-i18n="nav-contacto">contacto</a>
        </nav>
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <!-- PROYECTOS -->
    <section id="proyectos" class="fade-in">
        <div class="projects-grid" id="projectsGrid">
            <div class="loading">Cargando proyectos...</div>
        </div>
    </section>

    <!-- SELECTOR DE IDIOMA -->
    <div class="language-selector" style="position: fixed; bottom: 30px; right: 30px; z-index: 200;">
        <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
        <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
        <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
    </div>


    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cargar proyectos de forma estática
        async function loadProjects() {
            const grid = document.getElementById('projectsGrid');
            if (!grid) return;
            
            const projects = [
                { cover: 'images/casa miralgo/casa-miralago-grupo-culata-jovai_21.jpg', name: 'Casa Miralago', path: '' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_16.jpg', name: 'Casa Mainumby', path: '' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_11.jpg', name: 'Casa Mainumby', path: '' },
                { cover: 'images/casa mainumby/casa-mainumby-grupo-culata-jovai_14.jpg', name: 'Casa Mainumby', path: '' },
                { cover: 'images/vivienda gt/30-vivienda-gt-grupo-culata-jovai-c-federico-cairoli-low.jpg', name: 'Vivienda GT', path: '' },
                { cover: 'images/casa miralgo/casa-miralago-grupo-culata-jovai_16.jpg', name: 'Casa Miralago', path: '' }
            ];

            grid.innerHTML = projects.map(project => `
                <div class="project-item">
                    <img src="${project.cover}" alt="${escapeHtml(project.name)}" loading="lazy" style="object-fit: cover;">
                    <div class="project-overlay">
                        <span>${escapeHtml(project.name)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Sistema de traducción
        const translations = {
            es: { 'nav-trabajos': 'trabajos', 'nav-sobre': 'sobre', 'nav-contacto': 'contacto' },
            en: { 'nav-trabajos': 'works', 'nav-sobre': 'about', 'nav-contacto': 'contact' },
            de: { 'nav-trabajos': 'arbeiten', 'nav-sobre': 'über', 'nav-contacto': 'kontakt' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            initLanguage();
        });
    </script>
</body>
</html>
