<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajos - Grupo Culata Jovái Arquitectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="landing-header" id="header">
        <nav>
            <a href="trabajos.html" class="nav-link" data-i18n="nav-trabajos">trabajos</a>
            <a href="sobre.html" class="nav-link" data-i18n="nav-sobre">sobre</a>
            <a href="contacto.html" class="nav-link" data-i18n="nav-contacto">contacto</a>
        </nav>
        <div class="logo-text" onclick="window.location.href='index.html'">
            <img src="images/logo.png" alt="Grupo Culata Jovái Arquitectos">
        </div>
    </header>

    <!-- PROYECTOS -->
    <section id="proyectos" class="fade-in">
        <div class="projects-grid" id="projectsGrid">
            <div class="loading">Cargando proyectos...</div>
        </div>
    </section>

    <!-- SELECTOR DE IDIOMA -->
    <div class="language-selector" style="position: fixed; bottom: 30px; right: 30px; z-index: 200;">
        <span class="lang-option active" data-lang="es" onclick="changeLanguage('es')">es</span>
        <span class="lang-option" data-lang="en" onclick="changeLanguage('en')">en</span>
        <span class="lang-option" data-lang="de" onclick="changeLanguage('de')">de</span>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="dropbox-config.js"></script>
    <script src="dropbox-service-vercel.js"></script>
    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cargar proyectos
        async function loadProjects() {
            const grid = document.getElementById('projectsGrid');
            if (!grid) return;
            
            try {
                // Intento primario: cargar desde la API
                const projects = await dropboxService.getAllProjectsWithCovers();
                
                if (projects.length === 0) {
                    throw new Error("No hay proyectos en Dropbox");
                }

                // Mostrar solo la portada de cada proyecto
                grid.innerHTML = projects.map((project, index) => `
                    <div class="project-item reveal" style="transition-delay: ${(index % 3) * 0.15}s" onclick="window.location.href='proyecto.html?path=${encodeURIComponent(project.path)}&source=trabajos'">
                        ${project.cover
                            ? `<img src="${project.cover}" alt="${escapeHtml(project.name)}" loading="lazy">`
                            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f5f5f5;color:#999;font-size:11px;letter-spacing:1px;text-transform:uppercase;">Sin portada</div>`
                        }
                        <div class="project-overlay">
                            <span>${escapeHtml(project.name)}</span>
                        </div>
                    </div>
                `).join('');

                setTimeout(() => {
                    if (typeof observer !== 'undefined') document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                }, 100);

            } catch (error) {
                console.warn('Error cargando proyectos desde API, usando fallback local:', error);
                
                // Fallback: cargar desde localStorage usando funciones de script.js
                if (typeof getProjects === 'function') {
                    const localProjects = getProjects();
                    if (localProjects.length > 0) {
                        grid.innerHTML = localProjects.map((project, index) => `
                            <div class="project-item reveal" style="transition-delay: ${(index % 3) * 0.15}s" onclick="window.location.href='proyecto.html?proyecto=${project.id}&source=trabajos'">
                                <img src="${project.images ? project.images[0] : project.image}" alt="${escapeHtml(project.title)}" loading="lazy">
                                <div class="project-overlay">
                                    <span>${escapeHtml(project.title)}</span>
                                </div>
                            </div>
                        `).join('');
                        
                        setTimeout(() => {
                            if (typeof observer !== 'undefined') document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                        }, 100);
                        return;
                    }
                }
                
                grid.innerHTML = `<div class="loading">No hay proyectos disponibles (Backend inactivo y sin caché local).</div>`;
            }
        }

        // Sistema de traducción
        const translations = {
            es: { 'nav-trabajos': 'trabajos', 'nav-sobre': 'sobre', 'nav-contacto': 'contacto' },
            en: { 'nav-trabajos': 'works', 'nav-sobre': 'about', 'nav-contacto': 'contact' },
            de: { 'nav-trabajos': 'arbeiten', 'nav-sobre': 'über', 'nav-contacto': 'kontakt' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            updateLanguageUI(lang);
            applyTranslations(lang);
        }

        function updateLanguageUI(lang) {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                }
            });
        }

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        function initLanguage() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'es';
            updateLanguageUI(savedLang);
            applyTranslations(savedLang);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            initLanguage();
        });
    </script>
</body>
</html>
